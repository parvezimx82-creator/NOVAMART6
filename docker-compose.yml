services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novamart}
      POSTGRES_USER: ${POSTGRES_USER:-novamart_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes: [ "postgres_data:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novamart_user} -d ${POSTGRES_DB:-novamart}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    command: sh -c "python manage.py makemigrations accounts catalog orders payments livechat && python manage.py migrate && python manage.py seed_payment_methods && python manage.py runserver 0.0.0.0:8000"
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    volumes: ["./frontend:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
